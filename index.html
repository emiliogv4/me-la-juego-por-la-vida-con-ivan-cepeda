<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Campaña</title>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* --- HEADER --- */
        header {
            background-color: #0F2D6B; /* NUEVO COLOR */
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            font-family: 'Lilita One', cursive;
            font-size: 16px;
            letter-spacing: 1px;
            height: 60px; 
        }
        .btn-header {
            background-color: #e8453c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-family: 'Lilita One', cursive;
            cursor: pointer;
            font-size: 14px;
        }

        /* --- CONTENEDORES PRINCIPALES --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        
        #pantalla-generador {
            display: none; 
            width: 100%;
            flex-direction: column;
            align-items: center;
        }
        #pantalla-inicio {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
        }

        /* --- PANTALLA DE INICIO --- */
        h1 {
            color: #0F2D6B; /* NUEVO COLOR */
            font-family: 'Lilita One', cursive;
            font-size: 32px;
            margin-bottom: 10px;
        }
        .subtitulo {
            color: #333;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .resaltado-rojo {
            color: #e8453c;
            font-weight: bold;
        }
        .imagen-muestra {
            width: 100%;
            max-width: 300px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        h2 {
            color: #0F2D6B; /* NUEVO COLOR */
            font-family: 'Lilita One', cursive;
            font-size: 20px;
            margin: 30px 0 20px 0;
        }
        
        .pasos-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        .paso-box {
            background-color: #f0f4fa;
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            font-family: 'Lilita One', cursive;
            color: #0F2D6B; /* NUEVO COLOR */
            font-size: 15px;
            text-align: left;
        }
        .paso-numero {
            background-color: #0F2D6B; /* NUEVO COLOR */
            color: white;
            min-width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            font-size: 16px;
        }

        .btn-azul {
            background-color: #0F2D6B; /* NUEVO COLOR */
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-family: 'Lilita One', cursive;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            transition: 0.3s;
        }
        .btn-naranja {
            background-color: #e8453c;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-family: 'Lilita One', cursive;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            max-width: 350px;
            transition: 0.3s;
        }
        .btn-azul:hover { background-color: #0a1f49; /* Tono más oscuro ajustado */ }
        .btn-naranja:hover { background-color: #c9362e; }

        /* --- PANTALLA GENERADOR --- */
        
        .encabezado-generador {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        .btn-volver {
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            margin-right: 15px;
            display: flex;
            align-items: center;
            transition: color 0.3s;
        }
        .btn-volver:hover {
            color: #0F2D6B; /* NUEVO COLOR */
        }
        .encabezado-generador h2 {
            margin: 0;
            font-size: 24px;
        }

        .etiqueta-container {
            width: 100%;
            max-width: 400px;
            text-align: left;
            margin-bottom: 8px;
        }
        .etiqueta {
            font-weight: bold;
            font-size: 14px;
            color: #333;
            font-family: 'Lilita One', cursive;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        input {
            flex: 1; 
            padding: 15px;
            border: 2px solid #0F2D6B; /* NUEVO COLOR */
            border-radius: 8px;
            font-size: 20px;
            text-align: center;
            font-family: 'Lilita One', cursive;
            color: #0F2D6B; /* NUEVO COLOR */
            outline: none;
            text-transform: uppercase;
        }
        input::placeholder { color: #a0aabf; }
        
        .btn-reset {
            display: none; 
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 56px; 
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #666;
            transition: background 0.2s;
        }
        .btn-reset:hover {
            background-color: #f0f4fa;
        }

        .canvas-container {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: center;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        button:disabled {
            background-color: #9ba8ce;
            cursor: not-allowed;
        }

        /* --- FOOTER --- */
        footer {
            background-color: #0F2D6B; /* NUEVO COLOR */
            color: white;
            text-align: center;
            padding: 15px 20px;
            font-family: 'Lilita One', cursive;
            font-size: 14px;
            margin-top: auto;
        }
        footer p {
            margin: 5px 0;
            font-family: Arial, sans-serif;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <header>
        <span>Estrategia Caribe</span>
        <button id="btnHeaderCrear" class="btn-header" onclick="irAlGenerador()">Crear imagen</button>
    </header>

    <main>
        <div id="pantalla-inicio">
            <h1>Firme por el Magdalena</h1>
            <p class="subtitulo">Personaliza tu imagen y demuestra que tú también te la juegas <span class="resaltado-rojo">por COLOMBIA.</span></
