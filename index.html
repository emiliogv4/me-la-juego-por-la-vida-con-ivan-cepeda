<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Campaña</title>
    <!-- Importamos una fuente similar a la de la captura (puedes cambiarla por la oficial de tu campaña) -->
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* Franja superior e inferior azul */
        header, footer {
            background-color: #21409a; /* Azul campaña */
            color: white;
            text-align: center;
            padding: 10px 20px;
            font-family: 'Titan One', cursive;
            font-size: 14px;
            letter-spacing: 1px;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .etiqueta {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
            color: #333;
        }
        input {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            border: 1px solid #b0c4de;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            font-family: 'Titan One', cursive;
            color: #666;
            margin-bottom: 20px;
            outline: none;
            text-transform: uppercase;
        }
        input::placeholder {
            color: #a0aabf;
        }
        /* Contenedor del Canvas para darle el estilo de tarjeta blanca */
        .canvas-container {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }
        /* El canvas ahora es visible y responsivo */
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        button {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Titan One', cursive;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background-color 0.3s;
        }
        /* Estado del botón: Desactivado vs Activado */
        button:disabled {
            background-color: #9ba8ce;
            cursor: not-allowed;
        }
        button:not(:disabled) {
            background-color: #21409a;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(33, 64, 154, 0.4);
        }
        button:not(:disabled):hover {
            background-color: #162d73;
        }
        .hint {
            font-size: 11px;
            color: #666;
            margin-top: 10px;
        }
        footer p {
            margin: 5px 0;
            font-family: Arial, sans-serif;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <header>
        Estrategia Caribe - Generador de Apoyo
    </header>

    <main>
        <div class="etiqueta">Escribe tu nombre:</div>
        <!-- Evento oninput para actualizar en tiempo real -->
        <input type="text" id="nombreInput" placeholder="TU NOMBRE AQUÍ..." maxlength="22" oninput="actualizarCanvas()">
        
        <div class="canvas-container">
            <canvas id="lienzo" width="800" height="800"></canvas>
        </div>

        <button id="btnDescargar" disabled onclick="descargarImagen()">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            Descargar / Compartir
        </button>
        <div class="hint" id="textoAyuda">Escribe tu nombre para activar la descarga</div>
    </main>

    <footer>
        <strong>Firme por el Magdalena y la Región</strong>
        <p>By ❤️ Equipo de Estrategia</p>
        <p>© 2026 - Desarrollo Web</p>
    </footer>

    <script>
        const canvas = document.getElementById('lienzo');
        const ctx = canvas.getContext('2d');
        const input = document.getElementById('nombreInput');
        const boton = document.getElementById('btnDescargar');
        const ayuda = document.getElementById('textoAyuda');
        
        // Cargar la imagen de plantilla (Asegúrate de que 'plantilla.png' esté en tu carpeta)
        const imagenFondo = new Image();
        imagenFondo.src = 'plantilla.png'; 

        // Cuando la imagen cargue, dibujamos el estado inicial vacío
        imagenFondo.onload = function() {
            dibujarEscena("");
        };

        // Función central: Dibuja la imagen y el texto encima
        function dibujarEscena(texto) {
            // 1. Limpiar el canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 2. Dibujar el fondo
            ctx.drawImage(imagenFondo, 0, 0, canvas.width, canvas.height);
            
            // 3. Configurar la tipografía de campaña
            ctx.font = '50px "Titan One"'; // Tamaño y fuente
            ctx.fillStyle = '#a0aabf';     // Color gris claro del texto original
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // 4. Dibujar el texto si existe
            if (texto.trim() !== "") {
                // Ajusta estas coordenadas (X, Y) según el diseño de TU plantilla.png
                // Aquí está centrado horizontalmente (canvas.width/2) y un poco más arriba de la mitad (300)
                ctx.fillText(texto.toUpperCase(), canvas.width / 2, 300); 
            }
        }

        // Se ejecuta cada vez que el usuario presiona una tecla
        function actualizarCanvas() {
            const nombre = input.value;
            
            // Actualizar la previsualización
            dibujarEscena(nombre);

            // Lógica del botón: activar/desactivar
            if (nombre.trim().length > 0) {
                boton.disabled = false;
                ayuda.style.visibility = 'hidden'; // Ocultar texto de ayuda
            } else {
                boton.disabled = true;
                ayuda.style.visibility = 'visible'; // Mostrar texto de ayuda
            }
        }

        // Descargar la imagen final
        function descargarImagen() {
            const nombre = input.value.trim();
            if (!nombre) return;

            const enlace = document.createElement('a');
            enlace.download = `apoyo-${nombre.replace(/\s+/g, '-').toLowerCase()}.png`;
            enlace.href = canvas.toDataURL('image/png');
            enlace.click();
        }
    </script>
</body>
</html>
