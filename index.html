<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Campaña</title>
    <!-- Importamos la fuente exacta del diseño -->
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header, footer {
            background-color: #0F2D6B; /* Ajustado al azul oficial */
            color: white;
            text-align: center;
            padding: 10px 20px;
            font-family: 'Lilita One', cursive;
            font-size: 16px;
            letter-spacing: 1px;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .etiqueta {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
            color: #333;
        }
        input {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            border: 1px solid #b0c4de;
            border-radius: 8px;
            font-size: 20px;
            text-align: center;
            font-family: 'Lilita One', cursive; /* Fuente aplicada a la caja de texto */
            color: #0F2D6B;
            margin-bottom: 20px;
            outline: none;
            text-transform: uppercase;
        }
        input::placeholder {
            color: #a0aabf;
        }
        .canvas-container {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        button {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            border-radius: 8px;
            border: none;
            font-size: 18px;
            font-family: 'Lilita One', cursive;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background-color 0.3s;
        }
        button:disabled {
            background-color: #9ba8ce;
            cursor: not-allowed;
        }
        button:not(:disabled) {
            background-color: #0F2D6B; /* Azul oficial en el botón */
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(23, 61, 151, 0.4);
        }
        button:not(:disabled):hover {
            background-color: #0f2a6b;
        }
        .hint {
            font-size: 11px;
            color: #666;
            margin-top: 10px;
        }
        footer p {
            margin: 5px 0;
            font-family: Arial, sans-serif;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <header>
        Estrategia Caribe - Generador de Apoyo
    </header>

    <main>
        <div class="etiqueta">Escribe tu nombre:</div>
        <input type="text" id="nombreInput" placeholder="TU NOMBRE AQUÍ..." maxlength="22" oninput="actualizarCanvas()">
        
        <div class="canvas-container">
            <canvas id="lienzo" width="800" height="800"></canvas>
        </div>

        <button id="btnDescargar" disabled onclick="descargarImagen()">
            <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            Descargar / Compartir
        </button>
        <div class="hint" id="textoAyuda">Escribe tu nombre para activar la descarga</div>
    </main>

    <footer>
        <strong>Firme por el Magdalena y la Región</strong>
        <p>By ❤️ Equipo de Estrategia</p>
        <p>© 2026 - Desarrollo Web</p>
    </footer>

    <script>
        const canvas = document.getElementById('lienzo');
        const ctx = canvas.getContext('2d');
        const input = document.getElementById('nombreInput');
        const boton = document.getElementById('btnDescargar');
        const ayuda = document.getElementById('textoAyuda');
        
        const imagenFondo = new Image();
        imagenFondo.src = 'plantilla.png'; 

        // Retrasamos un poquito el dibujado inicial para asegurar que la fuente externa cargue
        document.fonts.ready.then(function() {
            imagenFondo.onload = function() {
                dibujarEscena("");
            };
            // Por si la imagen carga antes que la fuente
            if(imagenFondo.complete) {
                dibujarEscena("");
            }
        });

        function dibujarEscena(texto) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(imagenFondo, 0, 0, canvas.width, canvas.height);
            
            // FUENTE LILITA ONE Y TAMAÑO
            ctx.font = '80px "Lilita One"'; 
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            if (texto.trim() === "") {
                ctx.fillStyle = '#b0c4de'; 
                ctx.fillText("TU NOMBRE", canvas.width / 2, 150); 
            } else {
                // COLOR EXACTO DEL DISEÑO
                ctx.fillStyle = '#0F2D6B'; 
                ctx.fillText(texto.toUpperCase(), canvas.width / 2, 150); 
            }
        }

        function actualizarCanvas() {
            const nombre = input.value;
            dibujarEscena(nombre);

            if (nombre.trim().length > 0) {
                boton.disabled = false;
                ayuda.style.visibility = 'hidden'; 
            } else {
                boton.disabled = true;
                ayuda.style.visibility = 'visible'; 
            }
        }

        function descargarImagen() {
            const nombre = input.value.trim();
            if (!nombre) return;

            const enlace = document.createElement('a');
            enlace.download = `apoyo-${nombre.replace(/\s+/g, '-').toLowerCase()}.png`;
            enlace.href = canvas.toDataURL('image/png');
            enlace.click();
        }
    </script>
</body>
</html>
